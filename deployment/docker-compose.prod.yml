# =====================================================================
# ĐẲNG CẤP COFFEE POS - PRODUCTION DOCKER COMPOSE STACK
# Optimized for Resource-Constrained VPS (2 vCPU, 2GB - 4GB RAM)
# Security Hardened: Private Internal Network, Zero Public DB Ports,
# Log Rotation, Container Healthchecks, and Explicit Resource Quotas.
# =====================================================================

services:
  # ==========================================
  # 1. DATABASE: MySQL 8.0 InnoDB
  # ==========================================
  mysql:
    image: mysql:8.0
    container_name: dangcap-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
      - --innodb-buffer-pool-size=256M
      - --innodb-log-file-size=64M
      - --max-connections=100
      - --skip-log-bin
    environment:
      MYSQL_ROOT_PASSWORD: ${DBMS_PASSWORD}
      MYSQL_DATABASE: backend
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - pos_mysql_data:/var/lib/mysql
    networks:
      - pos-backend-net
    expose:
      - "3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M
        reservations:
          memory: 384M

  # ==========================================
  # 2. IN-MEMORY CACHE & RATE LIMIT: Redis 7
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: dangcap-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass "${REDIS_PASSWORD}"
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --save 300 10
    volumes:
      - pos_redis_data:/data
    networks:
      - pos-backend-net
    expose:
      - "6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 192M
        reservations:
          memory: 64M

  # ==========================================
  # 3. CORE BACKEND: Spring Boot 3.4
  # ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: dangcap-backend:latest
    container_name: dangcap-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8080
      CONTEXT_PATH: /backend
      JAVA_OPTS: "-XX:+UseContainerSupport -Xmx768m -Xms256m -XX:+UseG1GC -Dfile.encoding=UTF-8"
      DBMS_CONNECTION: jdbc:mysql://mysql:3306/backend?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
      DBMS_USERNAME: root
      DBMS_PASSWORD: ${DBMS_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SIGNER_KEY: ${JWT_SIGNER_KEY}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ENABLE_FLYWAY: "true"
      AI_ENABLED: ${AI_ENABLED:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://pos.dangcapcoffee.vn}
      OUTBOX_TRANSPORT: local
      KAFKA_ENABLED: "false"
    volumes:
      - pos_backend_logs:/app/logs
    networks:
      - pos-backend-net
      - pos-frontend-net
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:8080/backend/actuator/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 4
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "15m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1200M
        reservations:
          memory: 512M

  # ==========================================
  # 4. FRONTEND & REVERSE PROXY: React Nginx
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: dangcap-frontend:latest
    container_name: dangcap-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    networks:
      - pos-frontend-net
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost/ || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
        reservations:
          memory: 32M

networks:
  pos-frontend-net:
    driver: bridge
  pos-backend-net:
    driver: bridge
    internal: true # Mạng nội bộ bảo vệ: Không cho phép bất kỳ truy cập từ Internet vào MySQL và Redis

volumes:
  pos_mysql_data:
    name: dangcap_pos_mysql_data
  pos_redis_data:
    name: dangcap_pos_redis_data
  pos_backend_logs:
    name: dangcap_pos_backend_logs
