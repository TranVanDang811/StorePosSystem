# =====================================================================
# ĐẲNG CẤP COFFEE POS - HARDENED PRODUCTION NGINX CONFIGURATION
# Supports: SSL/TLS Termination, Let's Encrypt Certbot Webroot,
# Reverse Proxy to Spring Boot API, Realtime WebSocket (STOMP 3600s),
# SPA Client Routing, Gzip Compression, and Comprehensive Security Headers.
# =====================================================================

# 1. Chuyển hướng toàn bộ HTTP (Port 80) sang HTTPS (Port 443)
server {
    listen 80;
    listen [::]:80;
    server_name pos.dangcapcoffee.vn localhost;

    # Let's Encrypt Certbot Challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect to HTTPS (nếu truy cập qua tên miền)
    location / {
        return 301 https://$host$request-uri;
    }
}

# 2. Cấu hình HTTPS an toàn (Port 443)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name pos.dangcapcoffee.vn;

    # Chứng chỉ SSL từ Let's Encrypt
    ssl_certificate /etc/letsencrypt/live/pos.dangcapcoffee.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pos.dangcapcoffee.vn/privkey.pem;

    # Tiêu chuẩn mã hóa SSL/TLS hiện đại
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384";
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS & Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Nén Gzip tối ưu tốc độ tải trang
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Giới hạn kích thước payload (cho phép upload ảnh lên tới 10MB)
    client_max_body_size 10M;

    # Reverse Proxy: Backend REST APIs
    location /backend/ {
        proxy_pass http://backend:8080/backend/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Reverse Proxy: Realtime WebSockets (STOMP / SockJS)
    location /backend/ws/pos/ {
        proxy_pass http://backend:8080/backend/ws/pos/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        
        # Giữ kết nối WebSocket không bị ngắt timeout mỗi 60s mặc định
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Cache tài nguyên tĩnh bất biến (JS, CSS, Ảnh, Font - lưu 1 năm)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2|woff|ttf)$ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # File index.html chính - Không cache để cập nhật tức thì khi deploy bản mới
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # Frontend React SPA Routing Fallback
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Trang báo lỗi 50x
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
