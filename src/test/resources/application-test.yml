spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:pos_test_db;MODE=MySQL;NON_KEYWORDS=USER;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driverClassName: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  flyway:
    enabled: false

jwt:
  signerKey: "test-secret-key-must-be-at-least-32-bytes-long-for-hmac-sha256-pos-system"
  valid-duration: 3600
  refreshable-duration: 86400
