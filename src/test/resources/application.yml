server:
  servlet:
    context-path: /backend

spring:
  application:
    name: pos-system-test
  profiles:
    active: test
  datasource:
    url: jdbc:h2:mem:pos_test_db;MODE=MySQL;NON_KEYWORDS=USER;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driverClassName: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  flyway:
    enabled: false
  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 20MB

jwt:
  signerKey: "test-secret-key-must-be-at-least-32-bytes-long-for-hmac-sha256-pos-system"
  valid-duration: 3600
  refreshable-duration: 86400

app:
  admin:
    username: testadmin
    password: testadminpassword
  cors:
    allowed-origins: http://localhost:5173

cloudinary:
  cloud-name: test-cloud
  api-key: test-api-key
  api-secret: test-api-secret

logging:
  level:
    root: WARN
    com.possystem.backend: INFO
