server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: ${CONTEXT_PATH:/backend}

spring:
  application:
    name: pos-system
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:@spring.profiles.active@}

  datasource:
    url: ${DBMS_CONNECTION:jdbc:mysql://localhost:3306/backend?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh}
    driverClassName: "com.mysql.cj.jdbc.Driver"
    username: ${DBMS_USERNAME:root}
    password: ${DBMS_PASSWORD:root}

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate.jdbc.time_zone: Asia/Ho_Chi_Minh
      hibernate:
        format_sql: ${FORMAT_SQL:false}

  flyway:
    enabled: ${ENABLE_FLYWAY:false}
    baseline-on-migrate: true
    baseline-version: 0

  servlet:
    multipart:
      enabled: true
      max-file-size: ${MAX_FILE_SIZE:5MB}
      max-request-size: ${MAX_REQUEST_SIZE:20MB}
      file-size-threshold: 1MB

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}

app:
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:admin}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

jwt:
  signerKey: ${JWT_SIGNER_KEY:}
  valid-duration: ${JWT_VALID_DURATION:86400}
  refreshable-duration: ${JWT_REFRESH_DURATION:604800}

open:
  api:
    title: POS System API
    version: v1.0.0
    description: API documentation for POS System
    serverUrl: ${SERVER_URL:http://localhost:8080/backend}
    serverName: POS System Server

logging:
  level:
    root: INFO
    com.possystem.backend: ${LOG_LEVEL:DEBUG}
