apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus-pos
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      timeInterval: "5s"

  - name: Jaeger
    type: jaeger
    uid: jaeger-pos
    access: proxy
    url: http://jaeger:16686
    editable: true
