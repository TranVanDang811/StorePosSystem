name: POS System CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ==========================================
  # 1. BACKEND CI: Maven Build & Unit/Integration Tests
  # ==========================================
  backend-ci:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Compile Backend & Run Tests
        working-directory: ./backend
        run: |
          mvn clean test --batch-mode

      - name: Package JAR (Verify Artifact)
        working-directory: ./backend
        run: |
          mvn package -DskipTests --batch-mode

  # ==========================================
  # 2. FRONTEND CI: Node Lint, Vitest & Production Build
  # ==========================================
  frontend-ci:
    name: Frontend Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: |
          npm ci

      - name: Run Vitest Unit Tests
        working-directory: ./frontend
        run: |
          npx vitest run

      - name: Build Production SPA Bundle
        working-directory: ./frontend
        run: |
          npm run build

  # ==========================================
  # 3. DOCKER VERIFICATION: Ensure Production Dockerfiles Build
  # ==========================================
  docker-verification:
    name: Docker Build Verification
    runs-on: ubuntu-latest
    needs: [ backend-ci, frontend-ci ]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify Backend Docker Build
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: dangcap-backend:test

      - name: Verify Frontend Docker Build
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: dangcap-frontend:test
